<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>charity: water - Push the Box Game</title>
    <link rel="icon" href="assets/svgs/Asset 1.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="vendor/css/normalize.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <div class="page__background">
      <div class="page__background--radial"></div>
      <div class="page__background--grid"></div>
    </div>

    <header class="page__header">
      <div class="partnership-logo page__header-brand">
        <div class="header-brand__item header-brand__item--left">
          <img src="assets/svgs/Asset 1.svg" class="logo-icon" alt="charity water logo" />
          <span class="logo-text logo-text--charity">charity: water</span>
        </div>
        <div class="header-brand__item header-brand__item--right">
          <img
            src="assets/images/asu_sunburst_logo_mobile_125px.png"
            class="logo-icon--asu"
            alt="asu sunburst logo"
          />
        </div>
      </div>
    </header>

    <div class="notification-bar" id="notification">Welcome to charity: water Push the Box!</div>

    <main class="page__main">
      <div class="difficulty-selector" id="difficulty-selector">
        <h2>Select Difficulty</h2>
        <button class="difficulty-btn app-btn selected" data-difficulty="easy">
          Easy (No Timer)
        </button>
        <button class="difficulty-btn app-btn" data-difficulty="normal">Normal (2 min)</button>
        <button class="difficulty-btn app-btn" data-difficulty="hard">Hard (30 sec)</button>
      </div>

      <div class="game-container">
        <div class="game-board" id="game-board">
          <!-- 9x9 grid will be generated by JS -->
        </div>
      </div>

      <div class="score-moves-panel">
        <div class="score-moves__item">
          <span class="score-moves__label">Score</span>
          <span class="score-moves__value" id="score">0</span>
        </div>
        <div class="score-moves__divider"></div>
        <div class="score-moves__item">
          <span class="score-moves__label">Moves</span>
          <span class="score-moves__value" id="moves">0</span>
        </div>
        <div class="score-moves__divider"></div>
        <div class="score-moves__item">
          <span class="score-moves__label">Time</span>
          <span class="score-moves__value" id="timer">--:--</span>
        </div>
        <button id="undo-btn" class="circle-btn" aria-label="Undo move" title="Undo move">↶</button>
      </div>

      <div class="level-progress">
        <div class="level-progress__circle level-progress__circle--current" id="progress-current">
          <span class="level-progress__label">1</span>
        </div>
        <div class="level-progress__dash"></div>
        <div class="level-progress__circle level-progress__circle--next" id="progress-next">
          <span class="level-progress__label">2</span>
        </div>
      </div>
      <div class="level-progress__finish" id="progress-finish" style="display: none">
        Finish line!
      </div>

      <div class="controls">
        <button id="reset-btn" class="app-btn">Reset Level</button>
        <button id="play-btn" class="app-btn">Play</button>
        <div class="mobile-dpad">
          <button class="dpad-btn" data-direction="up">↑</button>
          <button class="dpad-btn" data-direction="left">←</button>
          <button class="dpad-btn" data-direction="right">→</button>
          <button class="dpad-btn" data-direction="down">↓</button>
        </div>
      </div>

      <button id="mute-btn" class="floating-mute-btn" aria-label="Mute toggle">🔊</button>
    </main>

    <footer>
      <p>
        Website and Game Created by Vedant Patel |
        <a href="https://www.charitywater.org/" target="_blank">charity: water</a> |
        <a href="https://www.charitywater.org/donate" target="_blank">Donate</a>
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

    <!-- Audio elements -->
    <audio id="bucket-audio" preload="auto">
      <source src="./assets/audio/bucket.mp3" type="audio/mpeg" />
      <source src="./assets/audio/bucket.wav" type="audio/wav" />
    </audio>
    <audio id="move-audio" preload="auto">
      <source src="./assets/audio/move.mp3" type="audio/mpeg" />
      <source src="./assets/audio/move.wav" type="audio/wav" />
    </audio>
    <audio id="cheer-audio" preload="auto">
      <source src="./assets/audio/cheer.mp3" type="audio/mpeg" />
      <source src="./assets/audio/cheer.wav" type="audio/wav" />
    </audio>
  </body>
</html>
