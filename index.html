<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>charity: water - Push the Box Game</title>
    <link rel="icon" href="assets/svgs/Asset 1.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="vendor/css/normalize.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <div class="page__background">
      <div class="page__background--radial"></div>
      <div class="page__background--grid"></div>
    </div>

    <header class="page__header">
      <div class="partnership-logo page__header-brand">
        <div class="header-brand__item header-brand__item--left">
          <img src="assets/svgs/Asset 1.svg" class="logo-icon" alt="charity water logo" />
          <span class="logo-text logo-text--charity">charity: water</span>
        </div>
        <div class="header-brand__item header-brand__item--right">
          <img
            src="assets/images/asu_sunburst_logo_mobile_125px.png"
            class="logo-icon--asu"
            alt="asu sunburst logo"
          />
        </div>
      </div>
    </header>

    <div class="notification-bar" id="notification">Welcome to charity: water Push the Box!</div>

    <main class="page__main">
      <div class="game-container">
        <div class="game-board" id="game-board">
          <!-- 9x9 grid will be generated by JS -->
        </div>
      </div>

      <div class="score-moves-panel">
        <div class="score-moves__item">
          <span class="score-moves__label">Score</span>
          <span class="score-moves__value" id="score">0</span>
        </div>
        <div class="score-moves__divider"></div>
        <div class="score-moves__item">
          <span class="score-moves__label">Moves</span>
          <span class="score-moves__value" id="moves">0</span>
        </div>
      </div>

      <div class="level-progress">
        <div class="level-progress__circle level-progress__circle--current" id="progress-current">
          <span class="level-progress__label">1</span>
        </div>
        <div class="level-progress__dash"></div>
        <div class="level-progress__circle level-progress__circle--next" id="progress-next">
          <span class="level-progress__label">2</span>
        </div>
      </div>
      <div class="level-progress__finish" id="progress-finish" style="display: none">
        Finish line!
      </div>

      <div class="controls">
        <button id="reset-btn" class="reset-button reset-button--wide">Reset Level</button>
        <div class="mobile-dpad">
          <button class="dpad-btn" data-direction="up">↑</button>
          <button class="dpad-btn" data-direction="left">←</button>
          <button class="dpad-btn" data-direction="right">→</button>
          <button class="dpad-btn" data-direction="down">↓</button>
        </div>
      </div>
    </main>

    <footer>
      <p>Website and Game Created by Vedant Patel</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
